<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Executor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: rgba(10,10,10,0.95);
    color: #00ff88;
    font-family: 'Courier New', monospace;
    padding: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #00ff88;
    margin-bottom: 12px;
  }
  .title { font-size: 18px; font-weight: bold; }
  .status { font-size: 12px; }
  .status.offline { color: #ff4444; }
  textarea {
    flex: 1;
    background: #000;
    color: #00ff88;
    border: 1px solid #00ff88;
    padding: 10px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    resize: none;
    min-height: 200px;
  }
  .buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    background: #00ff88;
    color: #000;
    border: none;
    padding: 12px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    font-size: 14px;
  }
  button:active { background: #00cc66; }
  button.secondary {
    background: #222;
    color: #00ff88;
    border: 1px solid #00ff88;
  }
  .scripts {
    margin-top: 10px;
    max-height: 120px;
    overflow-y: auto;
    border: 1px solid #00ff88;
    padding: 8px;
  }
  .scripts h4 { margin-bottom: 6px; font-size: 12px; }
  .script-item {
    padding: 6px;
    border-bottom: 1px solid #1a1a1a;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">EXECUTOR</div>
    <div class="status" id="status">READY</div>
  </div>

  <textarea id="code" placeholder="-- اكتب كود Lua هنا"></textarea>

  <div class="buttons">
    <button onclick="execute()">EXECUTE</button>
    <button class="secondary" onclick="clearCode()">CLEAR</button>
  </div>

  <div class="scripts" id="scripts">
    <h4>SCRIPTS</h4>
    <div class="script-item" onclick="loadDefault()">default</div>
    <div class="script-item" onclick="loadInject()">inject</div>
  </div>

<script>
function setStatus(txt, offline) {
  const s = document.getElementById('status');
  s.textContent = txt;
  s.className = 'status' + (offline ? ' offline' : '');
}

function execute() {
  const code = document.getElementById('code').value;
  if (!code.trim()) return;
  setStatus('RUNNING');
  try {
    Android.execLua(code);
    setStatus('DONE');
  } catch (e) {
    setStatus('ERROR', true);
  }
}

function clearCode() {
  document.getElementById('code').value = '';
}

function loadDefault() {
  document.getElementById('code').value =
    '-- default script\nprint("Hello from Executor")';
}

function loadInject() {
  document.getElementById('code').value =
    '-- inject script\nlocal Players = game:GetService("Players")\nprint(Players.LocalPlayer.Name)';
}

window.onload = function() {
  setStatus('READY');
};
</script>
</body>
</html>
